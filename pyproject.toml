[project]
name = "nano-github"
version = "0.1.0"
description = "Nano GitHub Discord bot with GitHub webhooks, logging channels, and pull request review channels."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "discord.py>=2.4.0,<3.0.0",
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "pydantic-settings>=2.4.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6.0,<1.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

